name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify package data
        run: |
          pip install . --no-deps
          python -c "from prepcanvas.catalog import load_demo_subject; assert len(load_demo_subject()['questions']) == 12"

      - name: Run tests and privacy checks
        run: pytest -q
